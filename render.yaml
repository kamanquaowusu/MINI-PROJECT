# Render Blueprint: deploys the whole app (API + frontend) as one free-tier
# Docker web service. In Render: New + -> Blueprint -> connect this repo.
#
# NOTE on envVars: `value:` and `sync: false` are mutually exclusive --
# `sync: false` means "Render manages this in the dashboard, ignore the
# blueprint", so pairing it with a value is invalid and fails the whole
# blueprint sync. The sending address is not a credential, so it syncs
# normally; only the API key is dashboard-managed.
#
# Email goes through Brevo's HTTP API, NOT SMTP: Render's free tier blocks
# outbound SMTP ports 25/465/587, so an SMTP send can never succeed here.
services:
  - type: web
    name: safemomo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SAFEMOMO_FROM_EMAIL
        value: safemomoapi@gmail.com
      - key: SAFEMOMO_BREVO_API_KEY
        sync: false
